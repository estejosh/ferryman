[package]
name = "ferryman-iroh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The iroh lane: Ferryman channels synced machine to machine over QUIC, through a relay of our own."

# A crate of its own so the QUIC stack is linked by the one binary that runs the worker,
# and by nothing else: the channel crate keeps its "no network listener" promise, and the
# tray (which has its own Cargo.lock) never sees iroh at all.

[dependencies]
anyhow.workspace = true
chrono.workspace = true
ferryman-channel = { path = "../ferryman-channel" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
# Default features off: no n0 relays or DNS are used, so nothing that only serves them is
# compiled in, and `portmapper` (UPnP/NAT-PMP on the home router) is left out until a
# machine shows it needs it. `tls-ring` keeps the crypto provider the one the rest of the
# workspace already builds with: aws-lc-rs would want cmake and a C toolchain, the same
# reason reqwest is held at 0.12 in the workspace manifest.
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
# Same major as iroh's own, which already pulls it in; used for the file hashes.
blake3 = { version = "1.8", default-features = false, features = ["std"] }
# Only for the relay certificate pin (a ServerCertVerifier); the version iroh resolves.
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }

[dev-dependencies]
tempfile = "3.20"
