[package]
name = "ferry-deadman"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Timelocked succession for any git repo — seal an archive to a future drand beacon round; your projects outlive you, provably."
license = "LicenseRef-Ferryman-Source-Available"
repository = "https://github.com/estejosh/ferryman"
homepage = "https://github.com/estejosh/ferryman"
keywords = ["deadman", "timelock", "drand", "backup", "succession"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
aes-gcm = "0.11.1"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.9"
globset = "0.4.20"
hex = "0.4.3"
hkdf = "0.13.0"
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3"
tlock = "0.0.10"
toml = "1.1.4"
ureq = { version = "3.4.0", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
toml = { version = "1.1.4", features = ["parse"] }
