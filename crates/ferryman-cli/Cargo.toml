[package]
name = "ferryman-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "ferry"

[[bin]]
name = "ferry"
path = "src/main.rs"

[features]
# The Hive rescue channel (ADR 0027): opt-in, off by default.
hive-rescue = ["dep:ferryman-hive-rescue", "dep:iroh"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
ferryman-channel = { path = "../ferryman-channel" }
ferryman-iroh = { path = "../ferryman-iroh" }
ferryman-hive-rescue = { path = "../ferryman-hive-rescue", optional = true }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"], optional = true }
ferryman-ops = { path = "../ferryman-ops" }
ferryman-server = { path = "../ferryman-server" }
clap.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
hex.workspace = true
keyring.workspace = true
pbkdf2.workspace = true
rand.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.20"
