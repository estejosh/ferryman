[package]
name = "ferryman-tray"
version = "0.5.0"
edition = "2024"
license = "LicenseRef-Ferryman-Source-Available"
repository = "https://github.com/estejosh/ferryman"
description = "Ferryman in the system tray: what it is doing, and a switch to stop it."

# Deliberately NOT a member of the workspace. This is a desktop application and its
# dependencies need desktop libraries - GTK on Linux - which are absent from a headless
# server, and a headless server is exactly what most Ferryman agents run on. Making it a
# member would mean `cargo build --workspace` failing on the machines that matter most,
# to build a tray nobody there can see.

# Known advisory, accepted risk: the Linux menu backend (tray-icon -> muda ->
# libappindicator -> gtk 0.18 -> glib 0.18.5) carries GHSA-wrw7-89jp-8q8g, an
# unsoundness in glib::VariantStrIter. There is no patched release: gtk-rs 0.18
# (gtk3) is frozen at glib 0.18, and the fix (glib 0.20) requires the gtk4 stack,
# which libappindicator does not support. The tray never exercises VariantStrIter.
# The real fix is rewriting the Linux menu on gtk4 — tracked, not scheduled.

[dependencies]
anyhow = "1.0"
ferryman-channel = { path = "../ferryman-channel" }
ferryman-ops = { path = "../ferryman-ops" }
tray-icon = "0.19"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }

# GTK must be initialised before a tray icon exists on Linux, so `main` calls
# `gtk::init()` there - which needs `gtk` to be a DIRECT dependency, not merely present
# in the lockfile.
#
# It was not, and the Linux tray therefore never compiled: `gtk` arrives transitively
# through tray-icon -> muda -> libappindicator, which puts it in `Cargo.lock` and makes
# it look present without making it linkable. The tray was developed on Windows, this
# crate is excluded from the workspace so `cargo build --workspace` never touched it,
# and the release job that builds it is newer than the crate. Nothing had ever compiled
# this file for Linux until the first tag that included that job.
#
# Pinned to the 0.18 series to match what libappindicator already resolves, so this adds
# a link, not a second copy of the GTK stack.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
