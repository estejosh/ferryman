<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferryman</title>
<style>
:root{
  --bg:#0A121A; --panel:#0E1A24; --panel-2:#122334; --line:#1B2E3F; --line-2:#24405A;
  --text:#E6EEF4; --dim:#93A9BC; --faint:#63798D;
  --accent:#3B9EFF; --accent-dim:#1E5C99;
  --good:#3FBF8F; --warn:#E0A33E; --bad:#E2695C; --idle:#6B8296;
  --radius:8px;
}
:root[data-theme="light"]{
  --bg:#F5F8FA; --panel:#FFFFFF; --panel-2:#EEF3F7; --line:#DBE4EC; --line-2:#C6D4E0;
  --text:#0E1A24; --dim:#4A6076; --faint:#7A8FA3;
  --accent:#1668C7; --accent-dim:#9CC6F0;
  --good:#1E8A63; --warn:#96650F; --bad:#B23B2E; --idle:#7A8FA3;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{display:none;grid-template-columns:236px 1fr;grid-template-rows:56px 1fr;height:100vh}
#app.on{display:grid}
.topbar{
  grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 18px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;width:206px;flex:none}
.brand .glyph{
  width:26px;height:26px;border-radius:7px;flex:none;
  background:linear-gradient(150deg,var(--accent),#7C5CFF);
  display:grid;place-items:center;font-size:13px;color:#fff;font-weight:700
}
.proj{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;flex:none}
.search{flex:1;max-width:520px}
.search input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:7px 12px;color:var(--text);outline:none
}
.search input:focus{border-color:var(--accent-dim)}
.spacer{flex:1}
.sync{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.idle{background:var(--idle)}
.who{display:flex;align-items:center;gap:9px;font-size:13px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-dim);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:600}
.linkbtn{background:none;border:0;color:var(--dim);cursor:pointer;padding:4px 6px;border-radius:6px}
.linkbtn:hover{color:var(--text);background:var(--panel-2)}

.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto}
.side .grp{padding:16px 10px 6px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:none;border:1px solid transparent;border-radius:var(--radius);
  padding:8px 11px;color:var(--dim);cursor:pointer;text-align:left
}
.nav button:hover{background:var(--panel-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--panel-2);border-color:var(--line-2);color:var(--text);font-weight:500}
.nav .pill{
  background:var(--line-2);color:var(--text);border-radius:20px;padding:1px 7px;
  font-size:11px;min-width:20px;text-align:center
}
.main{overflow-y:auto;padding:26px 30px 60px}

/* ---------- page furniture ---------- */
.head{display:flex;align-items:flex-start;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.head h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em;font-weight:600}
.head p{margin:0;color:var(--dim);max-width:70ch}
.head .actions{margin-left:auto;display:flex;gap:8px}
.btn{
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--radius);
  padding:7px 13px;color:var(--text);cursor:pointer
}
.btn:hover{border-color:var(--accent-dim)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px}
.card .k{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.card .v{font-size:29px;font-weight:600;letter-spacing:-.02em;margin:5px 0 3px}
.card .s{font-size:12.5px;color:var(--dim)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
  padding:9px 14px;cursor:pointer;white-space:nowrap
}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--line)
}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel-2)}
.row .t{font-weight:500;letter-spacing:-.01em}
.row .m{color:var(--dim);font-size:12.5px;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .r{display:flex;align-items:center;gap:10px;flex:none}

.badge{
  display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;
  font-size:11.5px;border:1px solid var(--line-2);color:var(--dim);white-space:nowrap
}
.badge.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.badge.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.badge.accent{color:var(--accent);border-color:var(--accent-dim)}

.stripe{width:3px;align-self:stretch;border-radius:2px;background:var(--line-2);flex:none}

table.grid{width:100%;border-collapse:collapse}
table.grid th{
  text-align:left;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  font-weight:500;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap
}
table.grid td{padding:11px 16px;border-bottom:1px solid var(--line);color:var(--dim);vertical-align:top}
table.grid tr:last-child td{border-bottom:0}
table.grid td.lead{color:var(--text);font-weight:500}
table.grid tr:hover td{background:var(--panel-2)}
.scroll{overflow-x:auto}

.empty{padding:40px 20px;text-align:center;color:var(--faint)}
.notice{
  display:flex;gap:12px;align-items:flex-start;
  background:color-mix(in srgb,var(--warn) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
  border-radius:var(--radius);padding:12px 15px;margin-bottom:18px;color:var(--text);font-size:13.5px
}
.notice b{color:var(--warn)}

/* ---------- drawer ---------- */
.drawer{
  position:fixed;inset:0 0 0 auto;width:min(560px,92vw);background:var(--panel);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .18s ease;
  display:flex;flex-direction:column;z-index:40
}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:16px;font-weight:600;flex:1;letter-spacing:-.01em}
.drawer .body{padding:18px;overflow-y:auto;flex:1}
.drawer .foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;font-size:13px;margin-bottom:18px}
.kv dt{color:var(--faint)} .kv dd{margin:0;color:var(--text);word-break:break-word}
pre.out{
  background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:13px;
  max-height:340px;overflow:auto;white-space:pre-wrap;font-size:12.5px;color:var(--dim);margin:0
}
textarea.notes{
  width:100%;min-height:74px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:6px;padding:9px 11px;color:var(--text);outline:none;resize:vertical
}
textarea.notes:focus{border-color:var(--accent-dim)}

/* ---------- login ---------- */
#login{display:grid;place-items:center;height:100vh;padding:20px}
#login .box{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:28px}
#login h1{margin:0 0 6px;font-size:21px;letter-spacing:-.02em}
#login p{margin:0 0 20px;color:var(--dim);font-size:13.5px}
#login label{display:block;font-size:12px;color:var(--faint);margin:12px 0 5px;
  letter-spacing:.08em;text-transform:uppercase}
#login input{width:100%;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:9px 12px;outline:none}
#login input:focus{border-color:var(--accent-dim)}
#login .btn{width:100%;margin-top:18px;justify-content:center}
#login .msg{margin-top:12px;font-size:13px;min-height:19px;color:var(--bad)}
#login .alt{margin-top:14px;text-align:center;font-size:13px;color:var(--dim)}
#login .alt button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  .side{display:none}
  .brand{width:auto}
  .proj,.sync{display:none}
}
</style>
</head>
<body>

<section id="login">
  <div class="box">
    <h1 id="auth-title">Sign in</h1>
    <p id="auth-sub">This dashboard is bound to loopback. Your identity is held on this machine.</p>
    <form id="auth-form" autocomplete="off">
      <label for="auth-name">Operator name</label>
      <input id="auth-name" name="name" autocomplete="username" required>
      <label for="auth-password">Password</label>
      <input id="auth-password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn primary" id="auth-submit" type="submit">Sign in</button>
    </form>
    <div class="msg" id="auth-msg" role="status"></div>
    <div class="alt">
      <span id="auth-alt-text">No identity on this machine yet?</span>
      <button type="button" id="auth-toggle">Create one</button>
    </div>
  </div>
</section>

<div id="app">
  <div class="topbar">
    <div class="brand"><span class="glyph">F</span><span>Ferryman</span></div>
    <div class="proj mono" id="project">—</div>
    <div class="search"><input id="search" type="search" placeholder="Filter tasks, agents and activity" aria-label="Filter"></div>
    <div class="spacer"></div>
    <div class="sync"><span class="dot" id="sync-dot"></span><span id="sync-text">Checking</span></div>
    <div class="who">
      <span class="avatar" id="me-avatar">–</span>
      <span id="me">—</span>
      <button class="linkbtn" id="signout" type="button">Sign out</button>
    </div>
  </div>

  <nav class="side">
    <div class="nav" id="nav-main">
      <button data-page="home" aria-current="page">Home</button>
      <button data-page="tasks">Tasks <span class="pill num" id="count-tasks">0</span></button>
      <button data-page="review">Needs review <span class="pill num" id="count-review">0</span></button>
      <button data-page="agents">Agents <span class="pill num" id="count-agents">0</span></button>
      <button data-page="teammates">Teammates</button>
    </div>
    <div class="grp">System</div>
    <div class="nav" id="nav-system">
      <button data-page="ledger">Ledger</button>
      <button data-page="learnings">Learnings</button>
      <button data-page="engines">Engines</button>
      <button data-page="fleet">Fleet</button>
      <button data-page="vault">Vault</button>
    </div>
  </nav>

  <main class="main" id="main"></main></div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <header>
    <h2 id="drawer-title">Task</h2>
    <button class="linkbtn" id="drawer-close" type="button" aria-label="Close">Close</button>
  </header>
  <div class="body" id="drawer-body"></div>
  <div class="foot" id="drawer-foot"></div>
</aside>

<script>
"use strict";

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const state = { me: null, project: "—", tasks: [], roster: [], team: null, filter: "" };

async function api(path, opts) {
  const res = await fetch(path, { credentials: "same-origin", ...opts });
  if (res.status === 401) { showLogin(); throw new Error("not signed in"); }
  if (!res.ok) throw new Error((await res.text()) || `${res.status} on ${path}`);
  return res.status === 204 ? null : res.json();
}

/* ---------- shapes the channel actually uses ---------- */

// A task's state arrives as a string like `Claimed { by: "wisp" }`. The word in
// front is what a person scans for; the rest is detail.
function stateOf(task) {
  const raw = String(task.state ?? "");
  const word = raw.split(/[^A-Za-z]/)[0] || "Unknown";
  const tone = {
    Open: "accent", Offered: "accent", Claimed: "warn", Stale: "bad",
    AwaitingReview: "warn", ChangesRequested: "bad", Accepted: "good", Done: "good",
  }[word] || "";
  return { word, raw, tone };
}

// A signature is the one thing on this page that must never be softened: a
// result that does not verify is reported as such, not quietly styled as fine.
function sigBadge(sig) {
  if (!sig) return "";
  const ok = sig === "Valid";
  const tone = ok ? "good" : (sig === "Unsigned" ? "warn" : "bad");
  return `<span class="badge ${tone}">${esc(sig)}</span>`;
}

function ago(iso) {
  if (!iso) return "";
  const then = new Date(iso).getTime();
  if (!Number.isFinite(then)) return "";
  const s = Math.max(0, (Date.now() - then) / 1000);
  if (s < 90) return "just now";
  const m = s / 60; if (m < 60) return `${Math.round(m)}m ago`;
  const h = m / 60; if (h < 48) return `${Math.round(h)}h ago`;
  return `${Math.round(h / 24)}d ago`;
}

function matches(hay) {
  if (!state.filter) return true;
  return String(hay).toLowerCase().includes(state.filter);
}

/* ---------- auth ---------- */

let creating = false;

function showLogin() {
  $("#app").classList.remove("on");
  $("#login").style.display = "grid";
}
function showApp() {
  $("#login").style.display = "none";
  $("#app").classList.add("on");
}

$("#auth-toggle").addEventListener("click", () => {
  creating = !creating;
  $("#auth-title").textContent = creating ? "Create an identity" : "Sign in";
  $("#auth-submit").textContent = creating ? "Create identity" : "Sign in";
  $("#auth-alt-text").textContent = creating ? "Already have one?" : "No identity on this machine yet?";
  $("#auth-toggle").textContent = creating ? "Sign in" : "Create one";
  $("#auth-password").setAttribute("autocomplete", creating ? "new-password" : "current-password");
  $("#auth-msg").textContent = "";
});

$("#auth-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const name = $("#auth-name").value.trim();
  const password = $("#auth-password").value;
  const msg = $("#auth-msg");
  msg.textContent = "";
  $("#auth-submit").disabled = true;
  try {
    await api(creating ? "/api/auth/create" : "/api/auth/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ name, password }),
    });
    $("#auth-password").value = "";
    showApp();
    await boot();
  } catch (err) {
    // Say what went wrong. "Something went wrong" teaches the operator nothing
    // and makes a wrong password indistinguishable from a broken server.
    msg.textContent = String(err.message || err).slice(0, 200);
  } finally {
    $("#auth-submit").disabled = false;
  }
});

$("#signout").addEventListener("click", async () => {
  try { await api("/api/auth/logout", { method: "POST" }); } catch (_) {}
  state.me = null;
  showLogin();
});

/* ---------- drawer ---------- */

function openDrawer(title, body, foot = "") {
  $("#drawer-title").textContent = title;
  $("#drawer-body").innerHTML = body;
  $("#drawer-foot").innerHTML = foot;
  $("#drawer").classList.add("open");
  $("#drawer").setAttribute("aria-hidden", "false");
}
function closeDrawer() {
  $("#drawer").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden", "true");
}
$("#drawer-close").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

async function showTask(id) {
  openDrawer(id, `<div class="empty">Loading…</div>`);
  let d;
  try {
    d = await api(`/api/tasks/${encodeURIComponent(id)}`);
  } catch (err) {
    $("#drawer-body").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
    return;
  }
  const st = stateOf(d);
  const latest = (d.results || [])[(d.results || []).length - 1] || null;
  const body = `
    <dl class="kv">
      <dt>State</dt><dd><span class="badge ${st.tone}">${esc(st.word)}</span>
        <span class="mono" style="color:var(--faint)">${esc(st.raw)}</span></dd>
      <dt>Issued by</dt><dd>${esc(d.issued_by || "—")}</dd>
      <dt>Addressed to</dt><dd>${esc(d.assigned_to || "anyone")}</dd>
      <dt>Order signature</dt><dd>${sigBadge(d.sig) || "—"}</dd>
      <dt>Created</dt><dd>${esc(d.created_at || "—")} <span style="color:var(--faint)">${ago(d.created_at)}</span></dd>
      ${d.engine ? `<dt>Engine</dt><dd>${esc(d.engine)}</dd>` : ""}
      ${(d.depends_on || []).length ? `<dt>Depends on</dt><dd class="mono">${esc((d.depends_on||[]).join(", "))}</dd>` : ""}
      ${d.requires_approval ? `<dt>Approval</dt><dd><span class="badge warn">Master must accept</span></dd>` : ""}
    </dl>
    <h3 style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 8px">The order</h3>
    <pre class="out">${esc(d.order || d.payload?.task || "—")}</pre>
    ${latest ? `
      <h3 style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px">
        Result r${esc(latest.revision ?? 1)} by ${esc(latest.agent || "—")} ${sigBadge(latest.sig)}
      </h3>
      <pre class="out">${esc(latest.output || "(no output recorded)")}</pre>` : ""}
    ${(d.reviews || []).length ? `
      <h3 style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px">Reviews</h3>
      ${(d.reviews || []).map((r) => `
        <div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)">
          <div><div class="t">${r.accepted ? "Accepted" : "Sent back"} by ${esc(r.reviewer || "—")}</div>
          <div class="m">${esc(r.notes || "")}</div></div>
        </div>`).join("")}` : ""}
  `;
  const reviewable = st.word === "AwaitingReview";
  const foot = reviewable ? `
    <textarea class="notes" id="review-notes" placeholder="Notes — required when sending back, so the worker knows what to change"></textarea>
    <button class="btn primary" id="accept">Accept</button>
    <button class="btn" id="sendback">Send back</button>
    <span id="review-msg" style="align-self:center;color:var(--bad);font-size:13px"></span>
  ` : "";
  openDrawer(id, body, foot);

  if (reviewable) {
    const verdict = async (accepted) => {
      const notes = $("#review-notes").value.trim();
      if (!accepted && !notes) {
        $("#review-msg").textContent = "Say what needs changing.";
        return;
      }
      $("#accept").disabled = $("#sendback").disabled = true;
      try {
        await api(`/api/tasks/${encodeURIComponent(id)}/review`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ accepted, notes, revision: latest?.revision ?? 1 }),
        });
        closeDrawer();
        await refresh();
      } catch (err) {
        $("#review-msg").textContent = String(err.message).slice(0, 160);
        $("#accept").disabled = $("#sendback").disabled = false;
      }
    };
    $("#accept").addEventListener("click", () => verdict(true));
    $("#sendback").addEventListener("click", () => verdict(false));
  }
}

/* ---------- pages ---------- */

const pages = {};

function taskRow(t) {
  const st = stateOf(t);
  return `
    <div class="row" data-task="${esc(t.id)}" role="button" tabindex="0">
      <div>
        <div class="t">${esc(t.id)}</div>
        <div class="m">
          <span>${esc((t.task || "").slice(0, 110))}${(t.task || "").length > 110 ? "…" : ""}</span>
        </div>
      </div>
      <div class="r">
        ${t.holder ? `<span class="badge">${esc(t.holder)}</span>` : ""}
        ${t.engine ? `<span class="badge">${esc(t.engine)}</span>` : ""}
        ${sigBadge(t.sig)}
        <span class="badge ${st.tone}">${esc(st.word)}</span>
      </div>
    </div>`;
}

function wireRows() {
  $$("[data-task]").forEach((el) => {
    const go = () => showTask(el.dataset.task);
    el.addEventListener("click", go);
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}

pages.home = async () => {
  const tasks = state.tasks;
  const counts = tasks.reduce((acc, t) => {
    acc[stateOf(t).word] = (acc[stateOf(t).word] || 0) + 1; return acc;
  }, {});
  const unverified = tasks.filter((t) => t.sig && t.sig !== "Valid").length;
  const working = (counts.Claimed || 0);
  const waiting = (counts.AwaitingReview || 0) + (counts.ChangesRequested || 0);
  const open = (counts.Open || 0) + (counts.Offered || 0);
  const stale = (counts.Stale || 0);

  return `
    <div class="head">
      <div><h1>Home</h1><p>What the fleet is doing right now, read from the channel.</p></div>
    </div>
    ${unverified ? `<div class="notice"><b>Attention</b><div>${unverified}
      ${unverified === 1 ? "record does" : "records do"} not carry a valid signature.
      Anything unverifiable is shown as it is, never treated as fine.</div></div>` : ""}
    ${stale ? `<div class="notice"><b>${stale} stale</b><div>A holder's heartbeat has lapsed. This is display only —
      the task stays with its holder and no other machine will pick it up.</div></div>` : ""}
    <div class="cards">
      <div class="card"><div class="k">Being worked</div><div class="v num">${working}</div>
        <div class="s">Claimed by an agent</div></div>
      <div class="card"><div class="k">Waiting on a person</div><div class="v num">${waiting}</div>
        <div class="s">Results needing a verdict</div></div>
      <div class="card"><div class="k">Unclaimed</div><div class="v num">${open}</div>
        <div class="s">Open or offered, nobody holding</div></div>
      <div class="card"><div class="k">Agents on the roster</div><div class="v num">${state.roster.length}</div>
        <div class="s">Named and keyed in this channel</div></div>
    </div>
    <div class="tabs"><button aria-selected="true">Recent activity</button></div>
    <div class="panel">${
      tasks.length
        ? tasks.slice(0, 12).map(taskRow).join("")
        : `<div class="empty">Nothing in this channel yet.</div>`
    }</div>`;
};

  <div class="head">
    <div><h1>Vault</h1><p>Recipient-bound secrets: an owner assigns one key to one named person, for one repository, for a stated time. Ferryman carries the sealed envelope and never the value.</p></div>
  </div>
  <div class="notice">
    <b>Not built yet</b>
    <div>The sealing code exists on a branch and is not merged. Nothing is shown here because
    there is nothing real to show, and a screen of example keys would be indistinguishable from
    the working thing at a glance.</div>
  </div>
  <div class="cards">
    <div class="card"><div class="k">One human</div><div class="v" style="font-size:15px;font-weight:500;margin-top:10px">No groups, no delegation</div>
      <div class="s">A grant names exactly one recipient.</div></div>
    <div class="card"><div class="k">Use-only</div><div class="v" style="font-size:15px;font-weight:500;margin-top:10px">Plaintext stays hidden</div>
      <div class="s">A local broker performs the operation; reveal is off by default.</div></div>
    <div class="card"><div class="k">Scoped</div><div class="v" style="font-size:15px;font-weight:500;margin-top:10px">One repository, one purpose</div>
      <div class="s">Anything outside the scope fails closed.</div></div>
    <div class="card"><div class="k">Revocable</div><div class="v" style="font-size:15px;font-weight:500;margin-top:10px">Checked before every use</div>
      <div class="s">Expiry ends it even on a machine that never syncs again.</div></div>
  </div>
  <p style="color:var(--dim);max-width:70ch;margin-top:18px">

/* ---------- routing and refresh ---------- */

let current = "home";

async function render() {
  const main = $("#main");
  try {
    main.innerHTML = await pages[current]();
  } catch (err) {
    main.innerHTML = `<div class="head"><div><h1>${esc(current)}</h1></div></div>
      <div class="notice"><b>Could not load</b><div>${esc(err.message)}</div></div>`;
  }
  wireRows();
}

$$("#nav-main button, #nav-system button").forEach((b) => {
  b.addEventListener("click", async () => {
    current = b.dataset.page;
    $$("#nav-main button, #nav-system button").forEach((o) =>
      o.removeAttribute("aria-current"));
    b.setAttribute("aria-current", "page");
    await render();
  });
});

let searchTimer;
$("#search").addEventListener("input", (e) => {
  state.filter = e.target.value.trim().toLowerCase();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 140);
});

function setSync(tone, text) {
  const dot = $("#sync-dot");
  dot.className = `dot ${tone}`;
  $("#sync-text").textContent = text;
}

async function refresh() {
  const [tasks, roster] = await Promise.allSettled([api("/api/tasks"), api("/api/roster")]);

  if (tasks.status === "fulfilled") {
    const d = tasks.value;
    state.tasks = Array.isArray(d) ? d : (d.tasks || []);
    state.project = (Array.isArray(d) ? null : d.project) || state.project;
  }
  if (roster.status === "fulfilled") {
    const d = roster.value;
    state.roster = Array.isArray(d) ? d : (d.agents || d.roster || []);
  }

  $("#count-tasks").textContent = state.tasks.length;
  $("#count-review").textContent = state.tasks.filter(
    (t) => stateOf(t).word === "AwaitingReview").length;
  $("#count-agents").textContent = state.roster.length;
  $("#project").textContent = state.project;

  // The indicator reports what this page can see, not what Syncthing thinks.
  // A dashboard that says "healthy" while its own reads are failing is worse
  // than one that says nothing.
  const stale = state.tasks.filter((t) => stateOf(t).word === "Stale").length;
  if (tasks.status === "rejected") setSync("bad", "Channel unreadable");
  else if (stale) setSync("warn", `${stale} stale`);
  else setSync("", "Channel readable");

  await render();
}

async function boot() {
  const me = await api("/api/auth/whoami");
  state.me = me?.name || "operator";
  $("#me").textContent = state.me;
  $("#me-avatar").textContent = state.me.slice(0, 2).toUpperCase();
  showApp();
  await refresh();
}

// Poll gently. The channel is files on disk; hammering it buys nothing and
// makes the log unreadable.
setInterval(() => { if (state.me) refresh().catch(() => {}); }, 20000);

boot().catch(() => showLogin());</script>
