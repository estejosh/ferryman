<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferryman</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7fb; --fg:#0d132b; --mut:#5b637d; --card:#fff; --line:#dde1ee; --acc:#0d132b; --accfg:#f6f7fb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d132b; --fg:#eef0f7; --mut:#9aa3c0; --card:#151c3a; --line:#26305a; --acc:#eef0f7; --accfg:#0d132b; }
  }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, "Segoe UI", sans-serif; display:flex; align-items:center; justify-content:center; }
  main { width:min(30rem, 90vw); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:2rem; }
  h1 { font-size:1.35rem; margin:0 0 .75rem; }
  p { margin:.5rem 0; color:var(--mut); }
  code { background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:0 .3rem; }
  button { margin-top:1.25rem; width:100%; font:inherit; font-weight:600; padding:.7rem 1rem; border:0; border-radius:8px; background:var(--acc); color:var(--accfg); cursor:pointer; }
  button[disabled] { opacity:.6; cursor:default; }
  #err { color:#c0392b; }
</style>
</head>
<body>
<main>
  <h1 id="title">Ferryman</h1>
  <div id="body"></div>
  <p id="err" role="alert"></p>
  <button id="action" type="button"></button>
</main>
<script src="setup.js"></script>
</body>
</html>
