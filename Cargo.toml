[workspace]
members = [
  "crates/ferryman-channel",
  "crates/ferryman-core",
  "crates/ferryman-server",
  "crates/ferryman-cli",
  "crates/ferryman-ops",
  "crates/ferryman-worker-sdk",
]
# ferryman-tray is excluded on purpose: it needs desktop libraries (GTK on Linux) that a
# headless agent box does not have, and breaking the build there to compile a tray nobody
# on that machine can see would be the wrong trade. Built per platform in the release job.
exclude = ["crates/ferryman-tray"]
resolver = "2"

[workspace.package]
version = "0.5.2"
edition = "2024"
license = "LicenseRef-Ferryman-Source-Available"
repository = "https://github.com/estejosh/ferryman"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
chacha20poly1305 = "0.10"
axum = { version = "0.8", features = ["macros", "json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
hostname = "0.4"
ed25519-dalek = { version = "2.2", features = ["rand_core", "pkcs8", "pem"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service"] }
pbkdf2 = "0.12"
rpassword = "7.4"
http-body-util = "0.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
# The OpenTelemetry crates move as a set, and the set is held at 0.31 by
# `tracing-opentelemetry`, which at 0.32.1 still depends on `opentelemetry`
# 0.31. Bumping any of the first three to 0.32 on its own puts two versions of
# `opentelemetry` in the graph, and then the 0.32 SDK's exporter no longer
# satisfies a trait that came from the 0.31 API:
#
#   the trait `opentelemetry_sdk::trace::SpanExporter` is not implemented
#   for `opentelemetry_otlp::SpanExporter`
#   no method named `tracer` found for struct `SdkTracerProvider`
#
# Dependabot proposes exactly that bump, because from a single crate's point of
# view it looks safe. It is not, and it was measured rather than assumed: the
# whole family was moved to 0.32 together and it still failed, because
# tracing-opentelemetry drags 0.31 back in regardless.
#
# These four move together, when tracing-opentelemetry ships against 0.32.
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1.0"
hkdf = "0.12"
sha2 = "0.10"
system-idle-time = "1.0"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
wait-timeout = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
