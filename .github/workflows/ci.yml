name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
      - name: Install Linux system deps (dbus for keyring)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
  # macOS runs on EVERY push, not only on tags.
  #
  # It used to be gated to `refs/tags/v*`, and the cost of that was paid in full at the
  # first release: 101 commits of new work had never once been compiled or tested on
  # macOS, and the tag build was where we found out. A platform tested only at release
  # time is a platform whose bugs are all discovered at release time.
  #
  # The gate was presumably about macOS runner minutes, which bill at ten times Linux.
  # That does not apply here - this repository is public, and Actions minutes are free
  # for public repositories on all runner types. So it was buying nothing.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # Why this is not just `cargo test --workspace`
      #
      # When this fails, the only thing visible without a GitHub token is the
      # annotation "Process completed with exit code 101" - which does not name the
      # test, the assertion, or the file. On a platform none of the maintainers can
      # run locally, that is the difference between a fix and a guess. It produced two
      # wrong guesses before this step existed.
      #
      # The job summary is rendered on the run page and readable by anyone who can see
      # the repository, so the failing test travels with the failure.
      - name: Test
        id: test
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt

      - name: Report which tests failed
        if: failure() && steps.test.outcome == 'failure'
        run: |
          {
            echo '## macOS test failures'
            echo
            echo 'Names of the failing tests, then the assertions:'
            echo
            echo '```'
            # The `failures:` blocks list the test names; the panics carry the reason.
            awk '/^failures:$/,/^test result:/' test-output.txt | head -60
            echo '```'
            echo
            echo '```'
            grep -A6 'panicked at' test-output.txt | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - run: cargo build --workspace --release
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      # contents: write is needed only so the SBOM can be attached to a release as an
      # asset. On a tag push the action finds the release and uploads to it; with
      # read-only contents that step fails with "Resource not accessible by
      # integration", which is why this job passed on every branch push and only broke
      # on the first actual release.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          # Downloaded to a file first, then unpacked. Piping curl into tar means a
          # dropped connection surfaces as "gzip: unexpected end of file" and fails the
          # secret scan, which reads exactly like a leak was found - alarming, and
          # nothing to do with secrets. It has already happened once.
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
          ./gitleaks detect --source . --no-git --no-banner --redact --exit-code 1
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: ferryman-sbom

  # The tray is excluded from the workspace, so `cargo build --workspace` above never
  # touches it. That exclusion is right - it needs GTK, and the machines running agents
  # are headless - but it left the tray compiled by nothing until a release tag.
  #
  # The cost of that was paid once already, and the crate's own comments record it: the
  # Linux tray never compiled, because `gtk` arrived only transitively and was in the
  # lockfile without being linkable. Nobody found out until the first tag that built it.
  #
  # This job is cheap insurance against the same shape of surprise. It builds the tray
  # on Linux on every push, so a change to ferryman-channel or ferryman-ops that the
  # tray cannot follow fails here, on a branch, rather than on a tag, in public.
  tray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
      - name: Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev
      - run: cargo fmt --check --manifest-path crates/ferryman-tray/Cargo.toml
      - run: >
          cargo clippy --manifest-path crates/ferryman-tray/Cargo.toml
          --all-targets -- -D warnings
      - run: cargo build --manifest-path crates/ferryman-tray/Cargo.toml --release
