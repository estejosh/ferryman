# Builds the binaries a release page needs, so adopting Ferryman does not require a
# Rust toolchain and a two-minute compile.
#
# Runs on a v* tag. Each target builds on its own runner rather than cross-compiling,
# because a binary built on the OS it targets is the one least likely to fail in a way
# nobody sees until a stranger reports it.
name: release

on:
  push:
    tags: ['v*']
  # Lets a release be re-cut without moving the tag, when only the packaging was wrong.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to'
        required: true

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing must not delete the others' artefacts: a release with three
      # of four platforms is worth publishing while the fourth is fixed.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Built on a real ARM runner, not cross-compiled. The audience for this
          # target is a Raspberry Pi, an Ampere VPS or an Oracle free-tier box -
          # machines self-hosters actually run - and "we ship an ARM binary that
          # nothing has ever executed" is not what any of them want to hear.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled from the Apple Silicon runner rather than built on an Intel
          # one. The macos-13 image sat queued indefinitely and never got a runner, so
          # v0.3.0 shipped without an Intel Mac binary. Rust targets Intel from an ARM
          # Mac with nothing but the target installed - the SDK carries both
          # architectures - and this is a pure-Rust binary with no native build steps,
          # so there is nothing that needs a matching host.
          #
          # The trade is that this artefact is never executed by CI before release.
          # Acceptable here and not in general: an Intel Mac binary that exists and is
          # untested beats one that does not exist.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@1.120
        with:
          targets: ${{ matrix.target }}

      # The OS credential store needs D-Bus headers on Linux, and nowhere else. This is
      # the same dependency the README tells people to install when building by hand.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      # Belt and braces. The toolchain action takes a `targets` input and should have
      # installed this already, but on the cross-compiled Intel Mac job it did not, and
      # the build failed with "can't find crate for `core`" - the target's std was
      # simply absent. Asking twice costs a second and is idempotent.
      - name: Ensure the target's std is installed
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p ferryman-cli

      # Packaged per-OS: tar.gz where tar is native, zip on Windows, so the download
      # opens with a double click rather than needing a tool the user may not have.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="ferry-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/ferry" "dist/$name/"
          cp README.md LICENSE PRIVACY.md "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "ferry-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ferry.exe" "dist/$name/"
          Copy-Item README.md, LICENSE, PRIVACY.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Out-File -Encoding ascii "$name.zip.sha256"

      # Split by OS so each job only claims the files it actually produced. Listing
      # every pattern in every job means the zip patterns match nothing on Linux, and
      # fail_on_unmatched_files - which is worth keeping, because a silently missing
      # binary is worse than a failed build - turns that into a failure.
      - name: Attach to the release (unix)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ferry-${{ matrix.target }}.tar.gz
            ferry-${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true

      - name: Attach to the release (windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ferry-${{ matrix.target }}.zip
            ferry-${{ matrix.target }}.zip.sha256
          fail_on_unmatched_files: true

  # The double-clickable setup files, attached once rather than per-platform.
  #
  # They are the first thing on the README and the first thing a non-technical person
  # meets, so they have to be ON the release page - not only in the repository, where
  # finding them means knowing what a repository is. They are tiny text files and carry
  # no checksum of their own: what they do is fetch install.{sh,ps1}, which verifies the
  # release checksum before anything is installed.
  setup-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Attach the one-click setup files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            scripts/Ferryman-Setup.cmd
            scripts/Ferryman-Setup.command
          fail_on_unmatched_files: true

  # A separate job, not another entry in the matrix above, for two reasons.
  #
  # The tray is excluded from the workspace - it needs desktop libraries a headless
  # agent box does not have - so it builds from its own manifest rather than with
  # `-p`. And it is an extra, not the product: if it fails to build on some platform,
  # the `ferry` binaries must still reach the release page. A separate job cannot take
  # them down with it.
  tray:
    name: tray ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Built on a real ARM runner, not cross-compiled. The audience for this
          # target is a Raspberry Pi, an Ampere VPS or an Oracle free-tier box -
          # machines self-hosters actually run - and "we ship an ARM binary that
          # nothing has ever executed" is not what any of them want to hear.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@1.120
        with:
          targets: ${{ matrix.target }}

      # This is the whole reason the tray is not in the workspace: a system tray on
      # Linux is GTK and an appindicator, and neither is present on a server.
      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev

      - name: Ensure the target's std is installed
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: >
          cargo build --release --target ${{ matrix.target }}
          --manifest-path crates/ferryman-tray/Cargo.toml

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="ferryman-tray-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # Its own target directory, not the workspace's: a crate excluded from the
          # workspace does not share the workspace build output. Verified by building
          # it - the binary landed in crates/ferryman-tray/target, and packaging from
          # the workspace path would have failed at release time, on a tag, in public.
          cp "crates/ferryman-tray/target/${{ matrix.target }}/release/ferryman-tray" "dist/$name/"
          cp LICENSE "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "ferryman-tray-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          # See the unix step: an excluded crate has its own target directory.
          Copy-Item "crates/ferryman-tray/target/${{ matrix.target }}/release/ferryman-tray.exe" "dist/$name/"
          Copy-Item LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Out-File -Encoding ascii "$name.zip.sha256"

      - name: Attach to the release (unix)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ferryman-tray-${{ matrix.target }}.tar.gz
            ferryman-tray-${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true

      - name: Attach to the release (windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ferryman-tray-${{ matrix.target }}.zip
            ferryman-tray-${{ matrix.target }}.zip.sha256
          fail_on_unmatched_files: true
