# Builds the desktop app's installers: NSIS .exe and MSI on Windows, .deb and AppImage on
# Linux. Unsigned. Uploads them as workflow artifacts and makes no release.
#
# Two ways in. Run it by hand (Actions > desktop-bundle > Run workflow) to prove the
# installers build, or the release workflow calls it on a tag and attaches what it makes.
name: desktop-bundle

on:
  # TEMPORARY proof trigger (removed in the next commit): a workflow that is not yet on the
  # default branch cannot be dispatched, so this runs it from the branch instead.
  push:
    branches: [desktop-app]
    paths: ['.github/workflows/desktop-bundle.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (default: the one selected above)'
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  bundle:
    name: bundle ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-latest
            bundles: deb,appimage
    env:
      # The bundler, pinned and installed from crates.io under the crate's own lockfile
      # rather than fetched as an npm package: it decides what an installer contains, and
      # `cargo install --locked` is the supply chain this repository already audits.
      # tauri-cli is versioned separately from the `tauri` crate; this is the newest
      # release on the same 2.12 line.
      TAURI_CLI_VERSION: '2.12.3'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@1.97

      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf file xdg-utils

      - name: Cache the bundler
        id: cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}-rust-1.97

      - name: Install the bundler
        if: steps.cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "=${{ env.TAURI_CLI_VERSION }}" --locked

      # =====================================================================================
      # SIGNING HOOK - NOT WIRED YET. Everything this workflow produces is UNSIGNED.
      #
      # When Ferryman has an LLC, signing goes here, before the bundle step, and nowhere
      # else. The plan is Azure Artifact Signing for the Windows installers (and, after
      # that, a Microsoft Store submission, which signs the package itself).
      #
      # The shape, for whoever wires it: log in to Azure with OIDC (azure/login), then set
      # `bundle.windows.signCommand` for this one build only, by writing a config overlay
      # and passing it as `--config signing.json` to the bundle step below, so no account
      # or certificate detail is ever committed to tauri.conf.json:
      #
      #   { "bundle": { "windows": { "signCommand": "<signing tool> %1" } } }
      #
      # Tauri then signs the app binary and the installers itself. Until then SmartScreen
      # will warn on first run, and the README says so.
      # =====================================================================================

      - name: Build the installers
        working-directory: crates/ferryman-desktop
        shell: bash
        env:
          # linuxdeploy is itself an AppImage: run it extracted, since a CI runner has no
          # FUSE, and do not let its bundled strip choke on newer toolchains' sections.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Collect (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $out = "crates/ferryman-desktop/target/release/bundle"
          Copy-Item "$out/nsis/*.exe" dist/
          Copy-Item "$out/msi/*.msi" dist/
          Get-ChildItem dist | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name |
              Out-File -Encoding ascii "$($_.FullName).sha256"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Collect (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          out=crates/ferryman-desktop/target/release/bundle
          cp "$out"/deb/*.deb "$out"/appimage/*.AppImage dist/
          cd dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
